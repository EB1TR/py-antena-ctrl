<!DOCTYPE html>
<html>
<head lang="es">
	<title>TukuDeck Estación</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	<link rel="stylesheet" href="inspector.css" />
</head>
<body>
	<sdpi-item label="Estación">
		<sdpi-radio setting="station" default="stn2" columns="2">
			<option value="stn1">STN1</option>
			<option value="stn2">STN2</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Banda">
		<sdpi-radio setting="band" default="0" value-type="number" columns="3">
			<option value="0">N/A</option>
			<option value="160">160m</option>
			<option value="80">80m</option>
			<option value="60">60m</option>
			<option value="40">40m</option>
			<option value="30">30m</option>
			<option value="20">20m</option>
			<option value="17">17m</option>
			<option value="15">15m</option>
			<option value="12">12m</option>
			<option value="10">10m</option>
		</sdpi-radio>
	</sdpi-item>

	<sdpi-item label="Mostrar título">
		<sdpi-radio setting="showTitle" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar dato">
		<sdpi-radio setting="showValue" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar STN">
		<sdpi-radio setting="showStation" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<p>Opciones independientes para esta tecla. Se aplican a los elementos que tenga el botón; STN también controla los indicadores de uso de los rotores.</p>
</body>
</html>
