<!DOCTYPE html>
<html>

<head lang="es">
	<title>TukuDeck Rotor</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>

	<sdpi-item label="Rotor">
		<sdpi-radio
			setting="rotor"
			default="1"
			value-type="number"
			columns="3">
			<option value="1">TW1</option>
			<option value="2">TW2</option>
			<option value="3">TW3</option>
		</sdpi-radio>
	</sdpi-item>


	<sdpi-item label="Sentido">
 <sdpi-radio setting="direction" default="plus" columns="2">
  <option value="plus">Horario (+)</option><option value="minus">Antihorario (−)</option>
 </sdpi-radio>
</sdpi-item>
<sdpi-item label="Grados por pulsación">
 <sdpi-textfield setting="step" default="5" placeholder="1–359"></sdpi-textfield>
</sdpi-item>
<p>Grados enteros entre 1 y 359, relativos al destino actual del rotor.</p>
<sdpi-item label="Mostrar título">
		<sdpi-radio setting="showTitle" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar dato">
		<sdpi-radio setting="showValue" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar STN">
		<sdpi-radio setting="showStation" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<p>Opciones independientes para esta tecla. Se aplican a los elementos que tenga el botón; STN también controla los indicadores de uso de los rotores.</p>
</body>

</html>
