<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>TukuDeck · MOX / TUNE / ATU</title>
<style>body{margin:16px;background:#2d2d2d;color:#eee;font:13px system-ui}label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}select,input{background:#424242;color:#fff;border:1px solid #666;border-radius:4px;padding:6px;max-width:150px}p{color:#bbb;line-height:1.5}</style>
<script src="transmit-inspector.js" defer></script></head><body>
<label>Estación<select id="station"><option value="stn1">STN1</option><option value="stn2">STN2</option></select></label>
<p>Selecciona STN1 o STN2 para esta tecla. Una pulsación activa; la siguiente desactiva.</p>
<label>Mostrar título<input id="showTitle" type="checkbox" checked></label>
<label>Mostrar estado<input id="showValue" type="checkbox" checked></label>
<label>Mostrar estación<input id="showStation" type="checkbox" checked></label>
<p id="status">Conectando con Stream Deck…</p>
</body></html>
