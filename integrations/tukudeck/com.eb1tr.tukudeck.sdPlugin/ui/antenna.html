<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>TukuDeck</title>
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	<link rel="stylesheet" href="inspector.css" />
</head><body>
<sdpi-item label="Antena">
 <sdpi-radio setting="antenna" default="1" value-type="number" columns="3">
  <option value="1">ANT1</option><option value="2">ANT2</option><option value="3">ANT3</option>
 </sdpi-radio>
</sdpi-item>
<p>Selecciona la salida de antena de STN2.</p>

	<sdpi-item label="Mostrar título">
		<sdpi-radio setting="showTitle" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar dato">
		<sdpi-radio setting="showValue" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar STN">
		<sdpi-radio setting="showStation" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<p>Opciones independientes para esta tecla. Se aplican a los elementos que tenga el botón; STN también controla los indicadores de uso de los rotores.</p>
</body></html>
