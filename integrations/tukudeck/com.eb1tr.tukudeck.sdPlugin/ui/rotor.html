<!DOCTYPE html>
<html>

<head lang="es">
	<title>TukuDeck Rotor</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>

	<sdpi-item label="Rotor">
		<sdpi-radio
			setting="rotor"
			default="1"
			value-type="number"
			columns="3">
			<option value="1">TW1</option>
			<option value="2">TW2</option>
			<option value="3">TW3</option>
		</sdpi-radio>
	</sdpi-item>

	<sdpi-item label="Efecto LOC">
		<sdpi-radio setting="locEffect" default="fade" columns="2">
			<option value="none">Sin efecto</option>
			<option value="fade">Fade suave</option>
			<option value="blink1hz">Parpadeo 1 Hz</option>
			<option value="blink2hz">Parpadeo 2 Hz</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="En movimiento">
		<sdpi-radio setting="movementEffect" default="blink2hz" columns="2">
			<option value="none">Sin efecto</option>
			<option value="fade">Fade suave</option>
			<option value="blink1hz">Parpadeo 1 Hz</option>
			<option value="blink2hz">Parpadeo 2 Hz</option>
		</sdpi-radio>
	</sdpi-item>
	<p>El efecto de movimiento tiene prioridad sobre LOC. Sin conexión MQTT, se mantiene el aviso general.</p>

	<sdpi-item label="Mostrar título">
		<sdpi-radio setting="showTitle" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar dato">
		<sdpi-radio setting="showValue" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Mostrar STN">
		<sdpi-radio setting="showStation" default="show" columns="2">
			<option value="show">Sí</option><option value="hide">No</option>
		</sdpi-radio>
	</sdpi-item>
	<p>Opciones independientes para esta tecla. Se aplican a los elementos que tenga el botón; STN también controla los indicadores de uso de los rotores.</p>
</body>

</html>
